name: Feature request
description: Suggest an improvement to local ChatGPT export processing.
title: '[Feature]: '
body:
  - type: markdown
    attributes:
      value: Describe the workflow using generic examples. Do not include private exports, conversation content, credentials, or internal setup details.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What task is difficult with the current application?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the expected result and how it fits local ChatGPT export processing.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This request contains no private content or credentials.
          required: true
