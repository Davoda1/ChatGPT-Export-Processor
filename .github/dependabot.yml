version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    versioning-strategy: increase
    groups:
      compatible-updates:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # ASAR 4 removes the CJS writer interface used by the verified build.
      # Adopt that major version only together with the build API migration.
      - dependency-name: '@electron/asar'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:30'
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: 'ci(deps)'
